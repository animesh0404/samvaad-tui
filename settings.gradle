rootProject.name = 'samvaad-tui'

// Slice 1: consume the reusable JVM E2EE client library through a composite
// build. The sibling `e2ee-client` build provides `com.samvaad:e2ee-client`
// (plain JVM library, no Spring); dependency substitution resolves the
// TUI's `implementation 'com.samvaad:e2ee-client:0.1.0'` to the included
// build without requiring a published artifact. Relative path is from this
// settings file's directory (the TUI repo root) to the sibling build root.
includeBuild('../samvaad-server/e2ee-client')
