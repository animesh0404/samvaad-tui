plugins {
    id 'java'
    id 'application'
}

group = 'com.samvaad.tui'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'info.picocli:picocli:4.7.7'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.2'
    implementation 'com.googlecode.lanterna:lanterna:3.1.5'
    implementation 'org.springframework:spring-websocket:7.0.9'
    implementation 'org.springframework:spring-messaging:7.0.9'
    implementation 'org.apache.tomcat.embed:tomcat-embed-websocket:11.0.25'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.samvaad.tui.Main'
    applicationName = 'samvaad-tui'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

tasks.named('jar', Jar) {
    manifest {
        attributes('Main-Class': application.mainClass)
    }
}

tasks.named('run', JavaExec) {
    standardInput = System.in
}

tasks.named('test') {
    useJUnitPlatform()
}
